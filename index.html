<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{
  --navy:#1F3864; --blue:#2E5496; --gold:#BF8F00; --bg:#eef2f8; --card:#ffffff;
  --ink:#243043; --muted:#6b7688; --ok:#2E8B57; --ko:#B23A48; --warn:#a15c00;
  --line:#e3e8f1; --titolo:#1F3864; --soft:#eef3fb; --track:#edf1f7;
}
/* Modalita' scura: la decide il telefono. Le superfici scure (--navy) restano
   scure, i testi blu (--titolo) schiariscono: al buio lo stesso blu non puo'
   fare sia da fondo sia da scritta. */
@media (prefers-color-scheme: dark){
  :root{
    --navy:#2a4373; --blue:#5a82c4; --titolo:#9dbcf0; --gold:#d6a93c;
    --bg:#10151d; --card:#1a2029; --ink:#e7ecf4; --muted:#98a3b4;
    --ok:#63c68e; --ko:#e8737f; --warn:#d6a93c; --line:#2b3442;
    --soft:#232d3d; --track:#232d3d;
  }
  .b-cons{background:#1d3a28;color:#8ed7a6}.b-prov{background:#3a3420;color:#e3cd82}
  .b-parz{background:#3b2a1a;color:#e8b284}.b-open{background:#262f3c;color:#9aa6b8}
  .msg.ok{background:#1d3a28;color:#8ed7a6}.msg.warn{background:#3a3420;color:#e3cd82}
  .mstrip i.cons{background:#3e7a55}.mstrip i.prov{background:#8a7a33}.mstrip i.parz{background:#8a5c2e}
  .card,.tile,.kpi,.clist .item,nav.bottom{box-shadow:0 1px 4px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#16294b,#2E5496);
  color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 10px rgba(15,25,50,.25)}
header.top .logo{font-size:22px}
header.top h1{font-size:17px;font-weight:700;letter-spacing:.4px;flex:1;min-width:0;white-space:nowrap}
header.top .sub{font-size:11px;opacity:.8}
.year-mobile{border:1px solid rgba(255,255,255,.45);border-radius:8px;background:var(--card);color:var(--titolo);
  font-weight:800;padding:6px 7px;font-size:12px}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 4px rgba(20,35,70,.08)}
.card h2{font-size:15px;color:var(--titolo);margin-bottom:10px}
.card h3{font-size:13px;color:var(--titolo);margin-bottom:6px}
.muted{color:var(--muted);font-size:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:16px;padding:18px 14px;text-align:center;
  box-shadow:0 1px 4px rgba(20,35,70,.08);cursor:pointer;border:0;text-decoration:none;color:var(--ink)}
.tile .ico{font-size:30px;line-height:1;color:var(--blue)}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile .ico svg{width:30px;height:30px}
nav.bottom a .i svg{width:22px;height:22px}
.tile b{display:block;margin-top:8px;color:var(--titolo);font-size:14px}
.tile span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(20,35,70,.08);min-width:0;overflow:hidden}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:20px;font-weight:800;color:var(--titolo);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .det{font-size:11.5px;margin-top:3px;overflow-wrap:anywhere}
.pos{color:var(--ok)} .neg{color:var(--ko)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}
.bgroup{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%;position:relative}
.bar{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.bx{display:flex;gap:3px;margin-top:4px}
.bx span{flex:1;text-align:center;font-size:9px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;
  background:var(--card);margin-bottom:10px}
.clist .item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;
  box-shadow:0 1px 3px rgba(20,35,70,.07);display:block;cursor:pointer;
  text-decoration:none;color:var(--ink)}
.clist b{color:var(--titolo);font-size:14px}
.clist .row2{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:var(--muted)}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:10.5px;font-weight:700}
.b-cons{background:#dff1e2;color:#1d6b3a}.b-prov{background:#fdf3d0;color:#7f6000}
.b-parz{background:#fde5c8;color:#8d4d00}.b-open{background:#e8ecf3;color:#6b7688}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{color:#fff;background:var(--navy);padding:6px 6px;font-size:11px;text-align:right}
table.t th:first-child{text-align:left;border-radius:8px 0 0 0}
table.t th:last-child{border-radius:0 8px 0 0}
table.t td{padding:6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.t td:first-child{text-align:left;color:var(--muted)}
table.t tr.tot td{font-weight:800;color:var(--titolo);border-top:2px solid var(--titolo)}
.hbar{height:7px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:3px}
.hbar i{display:block;height:100%;border-radius:4px}
.hbar2{height:13px;background:var(--track);border-radius:7px;overflow:hidden;margin-top:8px;display:flex}
.hbar2 i{display:block;height:100%}
.p15{display:block;font-size:9.5px;color:var(--warn);margin-top:2px;font-weight:600}
.tbar{display:flex;gap:8px;margin-bottom:8px}
.sel{flex:1;min-width:0;padding:9px 8px;border:1.5px solid var(--line);border-radius:10px;
  font-size:12.5px;background:var(--card);color:var(--ink);font-family:inherit}
.row3{display:flex;justify-content:space-between;margin-top:3px;font-size:11.5px;color:var(--muted)}
/* conto economico: tabella larga, scorre in orizzontale dentro la card. La
   colonna Voce resta ferma a sinistra, con un'ombra che dice che sotto c'e'
   dell'altro. */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.scorri{font-size:11px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
table.ce{border-collapse:collapse;font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
table.ce th{background:var(--navy);color:#fff;font-size:10px;font-weight:600;padding:5px 7px;text-align:right}
table.ce th.q{background:var(--blue)}
table.ce th.voce,table.ce td:first-child{text-align:left;position:sticky;left:0;z-index:2}
table.ce th.voce{background:var(--navy)}
table.ce td:first-child{background:var(--card);white-space:normal;min-width:112px;
  font-size:11px;color:var(--ink);box-shadow:3px 0 6px -2px rgba(15,25,50,.28)}
table.ce td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--line)}
table.ce td.pc{color:var(--muted);font-size:10px}
table.ce td.b{font-weight:800;color:var(--titolo)}
table.ce td.vuoto{color:#b6bcc7}
table.ce tr.forte td{background:var(--soft);font-weight:700}
table.ce tr.forte td:first-child{background:var(--soft);color:var(--titolo)}
table.t tr.sel td{background:var(--soft)}
table.t td.rev{text-align:left;color:var(--titolo);font-weight:700}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;z-index:30;
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(20,35,70,.08)}
nav.bottom a{flex:1;min-width:0;text-align:center;padding:8px 1px 6px;font-size:10px;
  color:var(--muted);text-decoration:none;white-space:nowrap}
nav.bottom a .i{display:block;font-size:20px;line-height:1.25}
nav.bottom a.on{color:var(--titolo);font-weight:700}
.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:12px;
  padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--titolo);border:1.5px solid var(--titolo)}
.btn.small{padding:8px 12px;font-size:12.5px;border-radius:10px}
.msg{border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.msg.ok{background:#dff1e2;color:#1d6b3a}.msg.warn{background:#fdf3d0;color:#7f6000}
.back{color:#fff;text-decoration:none;font-size:22px;line-height:1;padding:4px 8px 4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statmini .lab{font-size:10.5px;color:var(--muted)}
.statmini .val{font-size:15px;font-weight:800;color:var(--titolo);font-variant-numeric:tabular-nums}
.mstrip{display:flex;gap:3px;margin-top:8px}
.mstrip i{flex:1;height:8px;border-radius:3px;background:var(--track)}
.mstrip i.cons{background:#79b98a}.mstrip i.prov{background:#e9cf6b}.mstrip i.parz{background:#e5a45c}
footer{padding:8px 16px 16px;text-align:center;font-size:10.5px;color:var(--muted)}
@media(max-width:430px){
  header.top{padding-left:9px;padding-right:9px;gap:7px}
  header.top>span{padding:3px 5px!important}header.top>span img{height:19px!important}
  header.top h1{font-size:15px}.year-mobile{width:66px;padding:5px 3px;font-size:11px}
  header.top .sub{display:none} main{padding:12px}.kpis{gap:8px}.kpi{padding:11px 10px}
  .kpi .val{font-size:19px}.tiles{gap:9px}.tile{padding:15px 10px}
}
@media(max-width:340px){.kpis,.grid2{grid-template-columns:1fr}}
/* ---- schermata di accesso: stessa veste del login BUSSOLA su PC ---- */
.lockwrap{margin:-14px;background:var(--card);min-height:100vh}
.lockpan{background:linear-gradient(160deg,#1F3864 0%,#16294a 100%);color:#fff;
  padding:calc(30px + env(safe-area-inset-top)) 20px 26px;text-align:center}
.bsvg{width:150px;height:150px;display:block;margin:0 auto}
.bbtn{background:none;border:0;padding:0;cursor:pointer;border-radius:50%;line-height:0}
.bbtn:active .bago{transform:rotate(12deg)}
.bago{transform-origin:110px 110px;transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.bnome{font-size:26px;font-weight:700;letter-spacing:.18em;margin-top:14px}
.bmotto{color:#ffd966;font-size:13.5px;font-style:italic;margin-top:8px}
.lockform{padding:24px 22px 34px;max-width:480px;margin:0 auto}
.blogo{height:38px;display:block;margin-bottom:14px}
.lockform h2{color:var(--titolo);font-size:16px;margin:0 0 2px}
.lsub{color:#667788;font-size:12.5px;margin:0 0 16px}
.lockform label{display:block;margin:10px 0 4px;font-size:13px;font-weight:600;color:var(--ink)}
.bgo{margin:14px 0;font-size:13px;color:var(--titolo);background:var(--soft);
  border:1px dashed #b9c4d6;border-radius:8px;padding:10px 12px;line-height:1.45}
.bgo::before{content:"\261D\00a0";color:var(--gold);font-size:15px}
.lver{font-size:10.5px;color:#aab;margin-top:16px;text-align:center}
</style>
</head>

<script>
"use strict";
/* ============================== stato & utils ============================== */
const MESI = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const MESIF = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio",
               "agosto","settembre","ottobre","novembre","dicembre"];
const REVS = ["T1","T2","T3","T4"];
const CATS = {F:"Forecast", CD:"Costi diretti", CI:"Costi Indiretti"};
const APP_VERSION = "5.0";
const CACHE_NOME = "bussola-v" + APP_VERSION;
/* Gli esercizi disponibili li dice il pacchetto dati (chiave "anni"): qui c'e'
   solo il ripiego per il primo avvio, prima che i dati arrivino. Prima erano
   scritti in due punti del guscio, e aprire un anno nuovo voleva dire
   ripubblicare la app. */
let ANNI = [2026, 2027];
let D = null;                       // dati caricati
let PACCHETTO = null;               // file SharePoint multianno completo
let annoDati = Number(sessionStorage.getItem("b_anno") || String(ANNI[0]));
if(!ANNI.includes(annoDati)) annoDati=ANNI[0];
let rev = localStorage.getItem("b_rev") || "T2";
if(!REVS.includes(rev)){ rev="T2"; localStorage.setItem("b_rev",rev); }
let catSel = "F";
let filtroDT = "";
let filtroPM = "";
let ordina = localStorage.getItem("b_ord") || "nome";
let soloMancanti = false;
let noFerme = localStorage.getItem("b_noferme") === "1";
/* La modalita' server dipende esclusivamente dall'indirizzo corrente. I dati
   riservati restano in memoria per questa sessione e non in localStorage, per
   evitare che un altro utente del telefono possa vedere il perimetro precedente. */
const APP_SERVER = location.pathname.startsWith("/app/");
let daServer = APP_SERVER;
let versioneDati = "";
let sync = {online:false, errore:"", ultimo:""};
/* Fuori dalla VPN i dati arrivano dal file che BUSSOLA pubblica nella cartella
   aziendale sincronizzata: serve il link in forma "download diretto"
   (.../_layouts/15/download.aspx?share=...), l'unica che il browser autorizza a
   leggere da un altro indirizzo. Qui resta vuoto di proposito: il guscio sta in
   un repository pubblico e l'indirizzo vale come una chiave, quindi lo si
   configura sul telefono (una volta sola) invece di scriverlo nel codice. */
const DATI_URL_DEFAULT = "";
let datiUrl = localStorage.getItem("b_url") || DATI_URL_DEFAULT;
/* Un indirizzo del tipo ...?dati=<link> configura la app al primo avvio: si
   distribuisce una volta ai DT e non devono incollare nulla. */
(function(){
  const q = new URLSearchParams(location.search).get("dati");
  if(q && /^https:\/\//i.test(q)){
    datiUrl = q; localStorage.setItem("b_url", q);
    history.replaceState(null, "", location.pathname + location.hash);
  }
})();

const eur = v => (v==null||isNaN(v)) ? "–" :
  Math.round(v).toLocaleString("it-IT");
const eurK = v => {
  if (v==null||isNaN(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toLocaleString("it-IT",{maximumFractionDigits:2})+" M";
  if (a >= 1e3) return Math.round(v/1e3).toLocaleString("it-IT")+" k";
  return Math.round(v).toLocaleString("it-IT");
};
const pct = v => (v==null||!isFinite(v)) ? "–" :
  (v*100).toLocaleString("it-IT",{maximumFractionDigits:1})+"%";
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S = a => (a||[]).reduce((x,y)=>x+(y||0),0);          // somma con null
function slice(a, m1, m2){ return (a||[]).slice(m1-1, m2); }

function mesiCons(){ if(!D) return 0;
  let k=0; for(let m=1;m<=12;m++) if((D.mesi_stato[m]||"")==="Consuntivato") k=m; return k; }
function meseLavoro(){ if(!D) return 0;
  let k=0; for(let m=1;m<=12;m++){const s=D.mesi_stato[m]||"";
    if(s==="Provvisorio"||s==="Parziale al 15") k=m;}
  if(k) return k;
  for(let m=1;m<=12;m++) if((D.mesi_stato[m]||"")!=="Consuntivato") return m;
  return 12; }
function bud(c, r, cat){ return ((c.bud||{})[r]||{})[cat] || Array(12).fill(0); }
function act(c, cat){ return (c.act||{})[cat] || Array(12).fill(null); }

/* margine di commessa: actual/budget per mese */
function margA(c,m){ const f=act(c,"Forecast")[m-1], cd=act(c,"Costi diretti")[m-1], ci=act(c,"Costi Indiretti")[m-1];
  if(f==null&&cd==null&&ci==null) return null; return (f||0)-(cd||0)-(ci||0); }
function margB(c,r,m){ return (bud(c,r,"Forecast")[m-1]||0)-(bud(c,r,"Costi diretti")[m-1]||0)-(bud(c,r,"Costi Indiretti")[m-1]||0); }

/* ---- vita della commessa: dall'inizio dei lavori a oggi ----
   prodotto = progressivo di apertura + produzione dell'esercizio selezionato.
   SAL BIS ed extra restano fuori:
   non sono contratto, quindi non entrano nella percentuale di avanzamento. */
function vita(c){
  const k = mesiCons(), p = c.preg || {};
  const r26 = S(act(c,"Forecast")), d26 = S(act(c,"Costi diretti")), i26 = S(act(c,"Costi Indiretti"));
  const prod = (p.ricavi||0) + r26;
  const costi = (p.cd||0) + (p.ci||0) + d26 + i26;
  // stima a fine esercizio: actual dei mesi chiusi + budget della revisione sul resto
  const fine26 = (p.ricavi||0) + S(slice(act(c,"Forecast"),1,k)) + S(slice(bud(c,rev,"Forecast"),k+1,12));
  return { contratto:p.contratto||null, ric25:p.ricavi||0, ric26:r26,
           prod, costi, marg:prod-costi, fine26 };
}
/* ---- flussi fuori margine core: solo consuntivo (SAL BIS, extra, CCT) ---- */
function extra(c){
  const sb = S(act(c,"SAL BIS")), ex = S(act(c,"Ricavi extra contrattuali")), cc = S(act(c,"CCT"));
  return { sb, ex, cc, tot:sb+ex+cc,
           sbB:S(bud(c,rev,"SAL BIS")), exB:S(bud(c,rev,"Ricavi extra contrattuali")), ccB:S(bud(c,rev,"CCT")) };
}
/* Il parziale al 15 si mostra solo quando aggiunge informazione: nei mesi
   ancora "Parziale al 15" l'avanzamento E' gia' quel valore. */
function mostra15(p15, a){ return p15!=null && (a==null || Math.round(p15)!==Math.round(a)); }
/* Commessa "ferma" nella revisione: budget a zero E nessun consuntivo (nuova o
   dormiente). Chi produce senza budget NON e' ferma: e' un'anomalia da vedere,
   non da nascondere - stessa regola della web app. Nel file dati le categorie
   tutte a zero non vengono esportate, quindi "niente chiavi" = "tutto zero". */
function ferma(c){
  return !Object.keys((c.bud||{})[rev] || {}).length && !Object.keys(c.act || {}).length;
}
/* ---- totali annui di budget di una revisione ---- */
function annoRev(c,r){
  const ric = S(bud(c,r,"Forecast")), co = S(bud(c,r,"Costi diretti")) + S(bud(c,r,"Costi Indiretti"));
  return { ric, costi:co, marg:ric-co };
}

/* ================= sicurezza: PIN + Face ID (verifica locale) ================= */
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const protetta=()=>!!localStorage.getItem("b_pin");
const sbloccata=()=>sessionStorage.getItem("b_unlocked")==="1";
const bioAttivo=()=>!!localStorage.getItem("b_bio");
const bioSupportato=()=>!!(window.PublicKeyCredential && navigator.credentials);
async function creaPin(){
  const p1=document.getElementById("pin1").value, p2=document.getElementById("pin2").value;
  if(!/^\d{4,8}$/.test(p1)){ alert("Il PIN deve avere da 4 a 8 cifre."); return; }
  if(p1!==p2){ alert("I due PIN non coincidono."); return; }
  localStorage.setItem("b_pin", await sha(p1));
  sessionStorage.setItem("b_unlocked","1");
  if(bioSupportato() && confirm("PIN creato. Vuoi attivare anche lo sblocco col volto o l'impronta (Face ID / Touch ID)?"))
    await faceAttiva(true);
  render();
}
async function provaPin(){
  const p=document.getElementById("pin").value;
  if(await sha(p)===localStorage.getItem("b_pin")){
    sessionStorage.setItem("b_unlocked","1"); render(); }
  else { const el=document.getElementById("pinerr"); if(el) el.textContent="PIN errato, riprova."; }
}
async function faceAttiva(silente){
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:"Cosedil SpA BUSSOLA"},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"utente@bussola",displayName:"Utente BUSSOLA"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},
      timeout:60000}});
    localStorage.setItem("b_bio", b64(cred.rawId));
    if(!silente){ alert("Sblocco biometrico attivato."); render(); }
  }catch(e){ if(!silente) alert("Non attivato: "+e.message); }
}
async function faceSblocca(){
  try{

      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:"public-key",id:unb64(localStorage.getItem("b_bio"))}],
      userVerification:"required",timeout:60000}});
    sessionStorage.setItem("b_unlocked","1"); render();
  }catch(e){ const el=document.getElementById("pinerr");
    if(el) el.textContent="Riconoscimento non riuscito: usa il PIN."; }
}

function impostaAnni(lista){

function usaPacchetto(j, anno=annoDati){
  const esercizi = j && j.esercizi;
  const scelto = esercizi ? esercizi[String(anno)] : j;
  if(!scelto || !Array.isArray(scelto.commesse))
    throw new Error("il file non contiene i dati dell'esercizio " + anno);
  PACCHETTO = j;
  impostaAnni(j.anni || (j.esercizi && Object.keys(j.esercizi)));
  D = scelto;
  annoDati = Number(D.esercizio || anno);
  sessionStorage.setItem("b_anno", String(annoDati));
  versioneDati = String(j.versione || D.versione || D.generato || "");
  return D;
}
async function aggiornaServer(silenzioso=false){
  try{
    const r = await fetch("bussola_dati.json?anno="+annoDati, {cache:"no-store",credentials:"same-origin"});
    const ct = r.headers.get("content-type") || "";
    if(r.redirected || !r.ok || !ct.includes("application/json")){
      D=null; sync={online:false,errore:"Sessione scaduta",ultimo:sync.ultimo};
      render(); location.href="../login"; return false;
    }
    const j = await r.json();
    usaPacchetto(j, annoDati);
    sync={online:true,errore:"",ultimo:new Date().toLocaleString("it-IT")};
    // Rimuove i dati sensibili eventualmente lasciati da versioni precedenti.
    localStorage.removeItem("b_dati"); localStorage.removeItem("b_server");
    if(!silenzioso) render();
    return true;
  }catch(e){
    sync={online:false,errore:e.message||"Server non raggiungibile",ultimo:sync.ultimo};
    if(!silenzioso || !D) render();
    return false;
  }
}
async function controllaVersione(){
  if(!daServer || document.hidden) return;
  try{
    const r=await fetch("stato-dati.json?anno="+annoDati,{cache:"no-store",credentials:"same-origin"});
    const ct=r.headers.get("content-type")||"";
    if(r.redirected || !r.ok || !ct.includes("application/json")){
      D=null; render(); location.href="../login"; return;
    }
    const s=await r.json(), v=String(s.versione||"");
    if(v && v!==versioneDati){ await aggiornaServer(true); render(); }
    else sync.online=true;
  }catch(e){ sync.online=false; sync.errore=e.message||"Server non raggiungibile"; }

/* Lettura del file pubblicato da BUSSOLA nella cartella aziendale. La copia
   scaricata resta sul telefono, cosi' la app funziona anche senza rete e non
   riparte mai da una schermata vuota. */
async function aggiornaDaUrl(silenzioso=false){
  if(!datiUrl) return false;
  try{
    const r = await fetch(datiUrl, {cache:"no-store"});
    if(!r.ok) throw new Error("il server ha risposto " + r.status);
    const j = await r.json();
    usaPacchetto(j, annoDati);
    try{ localStorage.setItem("b_dati", JSON.stringify(j)); }catch(e){}
    localStorage.setItem("b_sync", new Date().toLocaleString("it-IT"));
    sync = {online:true, errore:"", ultimo:localStorage.getItem("b_sync")};
    if(!silenzioso) render();
    return true;
  }catch(e){
    // "Failed to fetch" non dice niente all'utente: le cause vere sono queste due.
    const msg = (e instanceof TypeError)
      ? "indirizzo non raggiungibile: manca la rete oppure il link e' scaduto"
      : (e.message || "errore imprevisto");
    sync = {online:false, errore:msg, ultimo:localStorage.getItem("b_sync")||""};
    if(!silenzioso) render();
    return false;
  }
}
async function caricaAuto(){
  if(daServer){ await aggiornaServer(false); return; }
  const s = localStorage.getItem("b_dati");
  if(s){ try{ usaPacchetto(JSON.parse(s),annoDati); }catch(e){ localStorage.removeItem("b_dati"); } }
  sync.ultimo = localStorage.getItem("b_sync") || "";
  // Prima si mostra la copia gia' scaricata, poi si va a vedere se e' cambiata:
  // l'app e' subito utilizzabile anche con la rete lenta.
  if(datiUrl){ if(D) render(); await aggiornaDaUrl(false); return; }
  render();
}

function cardExtra(c, pA, mA){
  const e = extra(c);
  if(!(e.tot || e.sbB || e.exB || e.ccB)) return "";
  const riga = (lab, a, b) => (a||b) ? `<tr><td>${lab}</td><td>${b?eur(b):""}</td>
      <td><b style="color:var(--navy)">${a?eur(a):"–"}</b></td></tr>` : "";
  const mt = mA + e.tot, ricT = pA + e.tot;
  return `
  <div class="card">
    <h2>Altri flussi (fuori margine core)</h2>
    <table class="t">
      <thead><tr><th>Voce</th><th>Budget ${rev}</th><th>Consuntivo</th></tr></thead>
      <tbody>
        ${riga("SAL BIS", e.sb, e.sbB)}
        ${riga("Ricavi extra contrattuali", e.ex, e.exB)}
        ${riga("CCT", e.cc, e.ccB)}
        <tr class="tot"><td>Marginalit&agrave; totale</td><td></td>
          <td class="${mt<0?'neg':'pos'}">${eur(mt)}</td></tr>
      </tbody>
    </table>
    <p class="muted" style="margin-top:8px;font-size:11px">Marginalit&agrave; totale = margine core
      ${eurK(mA)} + ${eurK(e.tot)} di questi flussi, pari al ${pct(ricT?mt/ricT:null)} dei ricavi

/* ================= conto economico di sintesi (schema Project Control) =======
   Stessa tabella della web app: righe fisse, una coppia di colonne (M€ e % sul
   Totale Valore della Produzione) per ogni periodo. Un trimestre compare solo
   quando ha l'actual di tutti e tre i mesi. */
const CE_RIGHE = [
  ["vdp",      "Valore della Produzione",        0],
  ["extra",    "Produzione Sal bis + CCT",       0],
  ["tot_vdp",  "Totale Valore della Produzione", 1],
  ["cd",       "Costi diretti",                  0],
  ["ci",       "Costi indiretti",                0],
  ["mol",      "Margine Operativo Lordo",        1],
  ["mrg_contr","Margine contrattuale",           0],
  ["tot_mrg",  "Totale Margine",                 1],
  ["sg",       "Spese generali",                 0],
  ["ebitda",   "Ebitda",                         1],
];
const CE_EXTRA = ["SAL BIS", "Ricavi extra contrattuali", "CCT"];
function mesiChiusi(){ const s=new Set();
  for(let m=1;m<=12;m++) if((D.mesi_stato[m]||"Aperto")!=="Aperto") s.add(m); return s; }
function revDiMese(m){ const rpm = D.rev_primo_mese || {T1:1,T2:4,T3:7,T4:10};
  let r = REVS[0]; for(const k of REVS) if((rpm[k]||1) <= m) r = k; return r; }
function ceColonne(){
  const chiusi = mesiChiusi();
  const cols = [{k:"s25", lab:"Cons. "+(D.esercizio-1), f:"S", mesi:[]},
                {k:"banno", lab:"Budget "+D.esercizio, f:"B", rev:REVS[0], mesi:[...Array(12)].map((_,i)=>i+1)}];
  for(let q=1;q<=4;q++){
    if(!chiusi.has(3*q)) break;
    const mesi = [...Array(3*q)].map((_,i)=>i+1);
    cols.push({k:"bq"+q, lab:"Budget Q"+q, f:"B", rev:REVS[q-1], mesi});
    cols.push({k:"cq"+q, lab:"Cons. Q"+q, f:"A", mesi, forte:1});
  }
  cols.push({k:"fcst", lab:"Forecast "+D.esercizio, f:"F", mesi:[...Array(12)].map((_,i)=>i+1), forte:1});
  return cols;
}
/* conSg: le spese generali sono un costo dell'AZIENDA. Vanno solo sul totale;
   con un filtro attivo ripartirle sul sottoinsieme sarebbe inventare un
   criterio (stessa regola della web app). */
function ceMatrice(sel, conSg){
  const chiusi = mesiChiusi();
  const val = (cat, col) => { let t=0;
    for(const c of sel) for(const m of col.mesi){
      if(col.f==="A" || (col.f==="F" && chiusi.has(m))) t += act(c,cat)[m-1]||0;
      else t += bud(c, col.rev || revDiMese(m), cat)[m-1]||0;
    } return t; };
  const sgMese = (D.spese_generali||0)/12;
  const out = {};
  for(const col of ceColonne()){
    let r;
    if(col.f==="S"){
      const s = k => sel.reduce((t,c)=>t+((c.stor25||{})[k]||0), 0);
      const v = s("ricavi"), cd = s("cd"), ci = s("ci");
      // il 2025 nel sistema ha solo ricavi/CD/CI: le righe che dipendono da
      // Sal bis e CCT restano ignote, non a zero
      r = {vdp:v, extra:null, tot_vdp:null, cd:-cd, ci:-ci, mol:v-cd-ci,
           mrg_contr:null, tot_mrg:null, sg:null, ebitda:null};
    } else {
      const vdp = val("Forecast",col), ex = S(CE_EXTRA.map(k=>val(k,col)));
      const cd = val("Costi diretti",col), ci = val("Costi Indiretti",col);
      const mol = vdp-cd-ci;
      r = {vdp, extra:ex, tot_vdp:vdp+ex, cd:-cd, ci:-ci, mol,
           mrg_contr:ex, tot_mrg:mol+ex, sg:null, ebitda:null};
      if(conSg){
        // mese per mese se il file li porta (dalla 5.0 in poi): budget o
        // actual secondo la colonna, come la web app; altrimenti annuo/12
        const M = D.spese_generali_mesi;
        let sg = 0;
        if(M && M.budget && M.actual){
          for(const m of col.mesi){
            const usaActual = col.f==="A" || (col.f==="F" && chiusi.has(m));
            sg += (usaActual ? M.actual[m-1] : M.budget[m-1]) || 0;
          }
        } else sg = sgMese*col.mesi.length;
        r.sg = -sg; r.ebitda = r.tot_mrg - sg; }
    }
    out[col.k] = r;
  }
  return out;
}
const me = v => (v==null||isNaN(v)) ? null :
  (Math.abs(v)<50 ? "0,0" : (v/1e6).toLocaleString("it-IT",{minimumFractionDigits:1,maximumFractionDigits:1}));
function pgCE(){
  if(!D) return pgNoDati();
  const sel = D.commesse.filter(c => (!filtroDT || c.dt===filtroDT) && (!filtroPM || c.pm===filtroPM));
  const conSg = !!D.spese_generali && !filtroDT && !filtroPM;
  const cols = ceColonne(), mat = ceMatrice(sel, conSg);
  const dts = [...new Set(D.commesse.map(c=>c.dt).filter(Boolean))].sort();
  const h1 = cols.map(c=>`<th colspan="2" class="${c.forte?'q':''}">${esc(c.lab)}</th>`).join("");
  const h2 = cols.map(()=>'<th>M&euro;</th><th>%</th>').join("");
  const righe = CE_RIGHE.map(([k,lab,forte])=>{
    const vuota = cols.every(c => mat[c.k][k]==null);
    const celle = cols.map(c=>{
      const v = mat[c.k][k];
      if(v==null) return '<td class="vuoto">&mdash;</td><td class="vuoto">&mdash;</td>';
      const base = mat[c.k].tot_vdp;
      return `<td${forte?' class="b"':''}>${me(v)}</td><td class="pc">${base?pct(v/base):"&mdash;"}</td>`;
    }).join("");
    return `<tr class="${forte&&!vuota?'forte':''}"><td class="${vuota?'vuoto':(forte?'b':'')}">${lab}</td>${celle}</tr>`;
  }).join("");
  const q = cols.filter(c=>c.f==="A").map(c=>c.lab);
  return `
  <div class="card"><h2>Conto economico di sintesi</h2>
    <div class="muted">${filtroDT||filtroPM ? `Filtro: <b>${esc(filtroDT||"")} ${esc(filtroPM||"")}</b> &middot; ${sel.length} commesse`
      : `Tutte le commesse (${sel.length})`} &middot; valori in <b>milioni</b>,
      percentuali sul Totale Valore della Produzione.</div>
    <div class="chips" style="margin-top:8px">${['',...dts].map(d=>
      `<button class="chip ${d===filtroDT?'on':''}" data-v="${esc(d)}"
        onclick="filtroPM='';setDT(this.dataset.v)">${esc(d)||'tutti i DT'}</button>`).join("")}</div>
  </div>
  <div class="card">
    <div class="scroll"><table class="ce">
      <thead><tr><th class="voce">Voce</th>${h1}</tr><tr><th class="voce"></th>${h2}</tr></thead>
      <tbody>${righe}</tbody>
    </table></div>
    ${cols.length>2?`<div class="scorri">&#8594; scorri di lato: altre ${cols.length-2} colonne
      (la voce resta ferma a sinistra)</div>`:""}
    <p class="muted" style="margin-top:8px;font-size:11px">Trimestri disponibili:
      <b>${q.join(", ")||"nessuno"}</b> (un trimestre compare quando ha l'actual di
      tutti e tre i mesi). <b>Budget Qn</b> = revisione in vigore in quel trimestre,
      cumulata da gennaio. <b>Forecast</b> = actual sui mesi chiusi + budget sui mesi aperti.
      ${conSg
        ? `<b>Spese generali</b>: ${eur(D.spese_generali)} annui ripartiti sui mesi della colonna.`
        : (D.spese_generali ? "<b>Spese generali</b> ed <b>Ebitda</b> restano vuote col filtro attivo: sono costi dell'azienda, non di commessa."
                            : "<b>Spese generali</b> assenti in questo file dati.")}
      Un trimestre che finisce con un mese provvisorio ha i ricavi reali ma i costi stimati.</p>
  </div>`;
}

/* ---- C. come e' cambiato il budget da T1 a T4 ---- */
function cardRevisioni(c){
  const rs = REVS.filter(r => (c.bud||{})[r]);
  if(rs.length < 2) return "";

      <td>${a.ric?pct(a.marg/a.ric):"–"}</td></tr>`; }).join("");
  const p = annoRev(c, rs[0]), u = annoRev(c, rs[rs.length-1]);
  const dR = u.ric-p.ric, dM = u.marg-p.marg;
  return `

      Totali dell'anno ${D.esercizio}, riga evidenziata = revisione selezionata.</p>

}

  window._q = q;
  const dts = [...new Set(D.commesse.map(c=>c.dt).filter(Boolean))].sort();
  const pms = [...new Set(D.commesse.filter(c => !filtroDT || c.dt===filtroDT)
    .map(c=>c.pm).filter(Boolean))].sort();
  const ml = meseLavoro();
  const righe = righeCommesse();
  // quante ne sta togliendo il filtro, dentro i filtri DT/PM gia' attivi
  const nFerme = D.commesse.filter(c =>
    (!filtroDT || c.dt===filtroDT) && (!filtroPM || c.pm===filtroPM) && ferma(c)).length;
  return `
  <input class="search" id="q" placeholder="&#128269; cerca commessa, PM o DT..." value="${esc(q)}"
    oninput="window._q=this.value;renderLista()">
  <div class="tbar">
    <select class="sel" onchange="ordina=this.value;localStorage.setItem('b_ord',ordina);render()">
      ${ORDINI.map(([v,l])=>`<option value="${v}"${v===ordina?" selected":""}>${l}</option>`).join("")}
    </select>
    <select class="sel" onchange="filtroPM=this.value;render()">
      <option value="">tutti i PM</option>
      ${pms.map(p=>`<option value="${esc(p)}"${p===filtroPM?" selected":""}>${esc(p)}</option>`).join("")}
    </select>
  </div>
  <div class="chips" id="chipsdt">${['',...dts].map(d=>
    `<button class="chip ${d===filtroDT?'on':''}" data-v="${esc(d)}"
      onclick="setDT(this.dataset.v)">${esc(d)||'tutti i DT'}</button>`).join("")}</div>
  <div class="chips"><button class="chip ${soloMancanti?'on':''}"
    onclick="soloMancanti=!soloMancanti;render()">&#9888;&#65039; manca ${MESI[ml-1]}</button>
    <button class="chip ${noFerme?'on':''}" title="Via le commesse con budget a zero e nessun consuntivo nella revisione scelta"
      onclick="noFerme=!noFerme;localStorage.setItem('b_noferme',noFerme?'1':'0');render()">&#128683; senza le ferme</button>
    <span class="muted" id="conta" style="align-self:center">${righe.length} commesse</span></div>
  ${noFerme?`<p class="muted" style="margin:-4px 0 10px;font-size:11px">Nascoste
    <b>${nFerme}</b> commesse ferme (budget ${rev} a zero e nessun consuntivo).
    Chi produce senza budget resta in elenco: &egrave; un'anomalia da vedere.</p>`:""}
  <div class="clist" id="lista">${htmlLista(righe)}</div>`;
}
function renderLista(){
  const el = document.getElementById("lista");
  if(!el) return;
  const righe = righeCommesse();
  el.innerHTML = htmlLista(righe);
  const ct = document.getElementById("conta");
  if(ct) ct.textContent = righe.length + " commesse";
}
function pgCommessa(i){
  const c = D?.commesse[i]; if(!c) return pgNoDati();
  const k = mesiCons();
  let um=0; for(let m=1;m<=12;m++) if(act(c,"Forecast")[m-1]!=null) um=m;
  const stUm = um ? (D.mesi_stato[um]||"Aperto") : "";
  const pA = S(slice(act(c,"Forecast"),1,k));
  const cA = S(slice(act(c,"Costi diretti"),1,k)) + S(slice(act(c,"Costi Indiretti"),1,k));
  const pB = S(slice(bud(c,rev,"Forecast"),1,k));
  const mA = pA - cA;
  // ultimo periodo
  const upF = um?act(c,"Forecast")[um-1]:null, upCD = um?act(c,"Costi diretti")[um-1]:null,
        upCI = um?act(c,"Costi Indiretti")[um-1]:null;
  // margine dell'ultimo periodo SOLO se ci sono anche i costi: col parziale
  // (sola produzione) un "margine" pari alla produzione sarebbe fuorviante
  const upM = (upCD==null&&upCI==null)?null:(upF||0)-(upCD||0)-(upCI||0);
  // parziale al 15 storicizzato: resta consultabile anche dopo la provvisoria
  const up15 = um ? (c.parz||[])[um-1] : null;
  // B+C stima anno: actual 1..k + budget k+1..12
  const bc = (cat)=> S(slice(act(c,cat),1,k)) + S(slice(bud(c,rev,cat),k+1,12));
  const bcP = bc("Forecast"), bcM = bc("Forecast")-bc("Costi diretti")-bc("Costi Indiretti");
  const catA = act(c, CATS[catSel]==="Forecast"?"Forecast":CATS[catSel]);
  const serie = catSel==="M" ? null : CATS[catSel];
  const sB = Array(12).fill(0), sA = Array(12).fill(null);
  for(let m=0;m<12;m++){
    if(serie){ sB[m] = bud(c,rev,serie)[m]||0; sA[m] = act(c,serie)[m]; }
    else { sB[m] = margB(c,rev,m+1); const x = margA(c,m+1); sA[m] = x; }
  }
  let righe = "", ha15 = false;
  for(let m=1;m<=12;m++){
    const b = sB[m-1], a2 = sA[m-1];
    const dl = (a2!=null && b) ? (a2-b)/b : null;
    const stm = D.mesi_stato[m]||"";
    const bcl = stm==="Consuntivato"?"b-cons":(stm==="Provvisorio"?"b-prov":(stm==="Parziale al 15"?"b-parz":"b-open"));
    const p15 = (catSel==="F") ? (c.parz||[])[m-1] : null;
    const v15 = mostra15(p15, a2); if(v15) ha15 = true;
    righe += `<tr><td><span class="badge ${bcl}" style="min-width:30px;text-align:center">${MESI[m-1]}</span>
      ${v15?`<span class="p15">al 15: ${eurK(p15)}</span>`:""}</td>
      <td>${b?eur(b):""}</td><td>${a2==null?"":eur(a2)}</td>
      <td class="${dl==null?'':(dl<0 ^ (catSel==='CD'||catSel==='CI') ? 'neg':'pos')}">${dl==null?"":pct(dl)}</td></tr>`;
  }
  const totB = S(sB), totA = S(sA.filter(v=>v!=null));
  return `
  <div class="card">
    <h2>${esc(c.c)}</h2>
    <div class="muted">DT <b>${esc(c.dt||"–")}</b> &middot; PM <b>${esc(c.pm||"–")}</b></div>
  </div>
  ${cardVita(c)}
  <div class="grid2">
    <div class="card statmini"><div class="lab">AVANZAMENTO CONSUNTIVATO (gen&ndash;${k?MESI[k-1]:'–'})</div>
      <div class="val">${eurK(pA)}</div>
      <div class="muted">costi ${eurK(cA)} &middot; margine <b class="${mA<0?'neg':'pos'}">${eurK(mA)}</b> (${pct(pA?mA/pA:null)})</div>
      <div class="hbar"><i style="width:${pB?Math.min(100,pA/pB*100):0}%;background:var(--blue)"></i></div>
      <div class="muted" style="margin-top:2px">${pct(pB?pA/pB:null)} del budget ${rev} di periodo</div></div>
    <div class="card statmini"><div class="lab">ULTIMO PERIODO ${um?("· "+MESI[um-1].toUpperCase()):""}</div>
      <div class="val">${eurK(upF)}</div>
      <div class="muted">${um?`<span class="badge ${stUm==="Consuntivato"?"b-cons":(stUm==="Provvisorio"?"b-prov":"b-parz")}">${esc(stUm)}</span>`:"nessun dato"}
      ${upM!=null?` margine <b class="${upM<0?'neg':'pos'}">${eurK(upM)}</b>`:""}</div>
      ${mostra15(up15,upF)?`<div class="muted" style="margin-top:4px">al 15 del mese
        <b style="color:var(--warn)">${eurK(up15)}</b>${upF!=null?
        ` &middot; seconda met&agrave; ${eurK(upF-up15)}`:""}</div>`:""}
      <div class="muted" style="margin-top:6px">Stima anno (B+C): <b style="color:var(--navy)">${eurK(bcP)}</b>
       &middot; margine <b class="${bcM<0?'neg':'pos'}">${eurK(bcM)}</b></div></div>
  </div>
  ${cardSilSal(c.c)}
  ${cardExtra(c, pA, mA)}
  <div class="card">
    <h2>Budget vs Avanzamento</h2>
    ${chipsRev()}
    <div class="chips">${[["F","Ricavi"],["CD","Costi dir."],["CI","Costi ind."],["M","Margine"]].map(([kk,l])=>
      `<button class="chip ${kk===catSel?'on':''}" onclick="catSel='${kk}';render()">${l}</button>`).join("")}</div>
    ${barChart(sB, sA, 12)}
    <table class="t" style="margin-top:10px">
      <thead><tr><th>Mese</th><th>Budget ${rev}</th><th>Avanz.</th><th>&Delta;%</th></tr></thead>
      <tbody>${righe}
      <tr class="tot"><td>TOTALE</td><td>${eur(totB)}</td><td>${eur(totA)}</td>
        <td>${totB?pct((totA-totB)/totB):""}</td></tr></tbody>
    </table>
    <p class="muted" style="margin-top:8px">L'avanzamento comprende consuntivato, provvisorio e parziale
    (vedi colore del mese). &Delta;% = (avanzamento &minus; budget) / budget.
    ${ha15?"<b>al 15</b> &egrave; la produzione registrata a met&agrave; mese, prima della provvisoria.":""}</p>
  </div>
  ${cardRevisioni(c)}`;
}

/* ====================== SIL vs SAL (dal file dati) ====================== */
/* Quanta produzione (SIL) e' gia' stata riconosciuta a SAL. Sul telefono e'
   una vista: i SAL emessi non ancora in CoGe si scrivono dalla web app e qui
   arrivano gia' dentro il conto To Date. */
function SS(){ return (D && D.silsal) || null; }
function mLab(m){
  const p = String(m||"").split("-");
  if(p.length<2) return esc(m||"");
  const i = Number(p[1])-1;
  return (MESI[i]||"").replace(/^./,x=>x.toUpperCase()) + " " + p[0].slice(2);
}
function ssRighe(){
  const S = SS(); if(!S) return [];
  const chi = {}; (D.commesse||[]).forEach(c => chi[c.c] = c);
  return Object.keys(S.commesse).map(n => {
    const v = S.commesse[n], a = chi[n] || {};
    const sil = v.sil[v.sil.length-1] || 0, sal = v.sal[v.sal.length-1] || 0;
    return {n, v, dt:a.dt||"", pm:a.pm||"", sil, sal, d:sil-sal,
            prod:v.prod||0, em:v.em||0, nota:v.nota||""};
  }).filter(r => (!filtroDT || r.dt===filtroDT) && (!filtroPM || r.pm===filtroPM))
    .sort((a,b) => b.d - a.d);
}
function pgSilSal(){
  if(!D) return pgNoDati();
  const SL = SS();
  if(!SL) return `<div class="card"><h2>SIL vs SAL</h2>
    <div class="msg warn">Questo file dati non contiene il SIL vs SAL: e' stato
    prodotto da una versione precedente di BUSSOLA. Aggiorna il file dalla
    pagina <b>Dati</b> e il riquadro comparira'.</div></div>`;
  const righe = ssRighe();
  const td = SL.todate || null;
  let tsil=0, tsal=0, tprod=0, tem=0;
  righe.forEach(r => { tsil+=r.sil; tsal+=r.sal; tprod+=r.prod; tem+=r.em; });
  const tdelta = tsil - tsal;
  const dts = [...new Set((D.commesse||[]).map(c=>c.dt).filter(Boolean))].sort();
  const base = mLab(SL.base);
  const kpi = `<div class="kpis">
    <div class="kpi"><div class="lab">SIL progressivo</div><div class="val">${eurK(tsil)}</div>
      <div class="det muted">a ${base}</div></div>
    <div class="kpi"><div class="lab">SAL progressivo</div><div class="val">${eurK(tsal)}</div>
      <div class="det muted">riconosciuto dal CoGe</div></div>
    <div class="kpi"><div class="lab">Delta SIL/SAL</div><div class="val">${eurK(tdelta)}</div>
      <div class="det muted">${tsil?pct(tdelta/tsil):"&mdash;"} del SIL</div></div>
    <div class="kpi"><div class="lab">Commesse</div><div class="val">${righe.length}</div>
      <div class="det muted">${filtroDT||filtroPM?"con il filtro attivo":"nel file"}</div></div>
  </div>`;
  const oggi = td ? `<div class="card">
    <h3>To Date &middot; oltre il CoGe di ${base}</h3>
    <div class="grid2" style="margin-top:6px">
      <div class="statmini"><div class="lab">SIL To Date</div><div class="val">${eurK(tsil+tprod)}</div></div>
      <div class="statmini"><div class="lab">SAL To Date</div><div class="val">${eurK(tsal+tem)}</div></div>
    </div>
    <div class="statmini" style="margin-top:8px"><div class="lab">Delta SIL/SAL To Date</div>
      <div class="val">${eurK((tsil+tprod)-(tsal+tem))}</div></div>
    <p class="muted" style="margin-top:8px">SIL del CoGe piu' la produzione registrata dopo${
      td.mesi && td.mesi.length ? " ("+esc(td.mesi.join(", "))+") " : " "}&euro; ${eurK(tprod)};
      SAL del CoGe piu' i SAL emessi non ancora contabilizzati &euro; ${eurK(tem)}.
      I SAL emessi li scrivono DT e PM dalla web app BUSSOLA.</p>
  </div>` : "";
  const elenco = righe.map(r => {
    const q = r.sil ? Math.max(0, Math.min(1, r.sal/r.sil)) : 0;
    const dOggi = (r.sil+r.prod) - (r.sal+r.em);
    return `<a class="item" href="#c/${(D.commesse||[]).findIndex(c=>c.c===r.n)}">
      <b>${esc(r.n)}</b>
      <div class="row2"><span>SIL <b>${eurK(r.sil)}</b> &middot; SAL <b>${eurK(r.sal)}</b></span>
        <span>delta <b>${eurK(r.d)}</b></span></div>
      <div class="hbar"><i style="width:${(100*q).toFixed(1)}%;background:var(--blue)"></i></div>
      <div class="row3"><span>SAL al ${pct(q)} del SIL</span>
        <span>${td?`To Date <b>${eurK(dOggi)}</b>`:"&nbsp;"}</span></div>
      ${r.em?`<span class="p15">SAL emessi ${eurK(r.em)}${r.nota?" &middot; "+esc(r.nota):""}</span>`:""}
    </a>`;
  }).join("");
  return `
  <div class="card"><h2>SIL vs SAL</h2>
    <div class="muted">Quanta produzione &egrave; gi&agrave; stata riconosciuta a SAL, al CoGe di
      <b>${base}</b>. Valori progressivi; il delta &egrave; la produzione ancora da riconoscere.</div>
    <div class="chips" style="margin-top:8px">${['',...dts].map(d =>
      `<button class="chip ${d===filtroDT?'on':''}" data-v="${esc(d)}"
        onclick="filtroPM='';setDT(this.dataset.v)">${esc(d)||'tutti i DT'}</button>`).join("")}</div>
    ${kpi}
  </div>
  ${oggi}
  <div class="card"><h3>Commesse, dal delta pi&ugrave; grande</h3>
    <div class="clist" style="margin-top:6px">${elenco||'<div class="muted">Nessuna commessa con questo filtro.</div>'}</div>
  </div>`;
}
function cardSilSal(nome){
  const SL = SS(); if(!SL || !SL.commesse[nome]) return "";
  const v = SL.commesse[nome];
  const sil = v.sil[v.sil.length-1]||0, sal = v.sal[v.sal.length-1]||0;
  if(!sil && !sal) return "";           // commessa non ancora nel CoGe: niente da mostrare
  const prod = v.prod||0, em = v.em||0, td = SL.todate;
  return `<div class="card"><h2>SIL vs SAL</h2>
    <div class="grid2">
      <div class="statmini"><div class="lab">SIL a ${mLab(SL.base)}</div><div class="val">${eurK(sil)}</div></div>
      <div class="statmini"><div class="lab">SAL da CoGe</div><div class="val">${eurK(sal)}</div></div>
    </div>
    <div class="statmini" style="margin-top:8px"><div class="lab">Delta SIL/SAL</div>
      <div class="val">${eurK(sil-sal)}</div></div>
    ${td?`<div class="grid2" style="margin-top:8px">
      <div class="statmini"><div class="lab">Delta To Date</div>
        <div class="val">${eurK((sil+prod)-(sal+em))}</div></div>
      <div class="statmini"><div class="lab">SAL emessi</div>
        <div class="val">${em?eurK(em):"&mdash;"}</div></div>
    </div>
    <p class="muted" style="margin-top:8px">${prod?`Produzione registrata dopo il CoGe
      &euro; ${eurK(prod)}. `:""}${em?`SAL emessi non ancora in CoGe &euro; ${eurK(em)}${
      v.nota?": "+esc(v.nota):""}.`:"Nessun SAL emesso segnalato per questo mese."}</p>`:""}
  </div>`;
}
/* ============================== router ============================== */
async function cambiaPin(){
  const att = prompt("PIN attuale:"); if(att==null) return;
  if(await sha(att)!==localStorage.getItem("b_pin")){ alert("PIN errato."); return; }
  const n1 = prompt("Nuovo PIN (4-8 cifre):"); if(n1==null) return;
  if(!/^\d{4,8}$/.test(n1)){ alert("PIN non valido."); return; }
  const n2 = prompt("Ripeti il nuovo PIN:");
  if(n1!==n2){ alert("I due PIN non coincidono."); return; }
  localStorage.setItem("b_pin", await sha(n1)); alert("PIN aggiornato.");
}
function bioToggle(){ if(bioAttivo()){ localStorage.removeItem("b_bio"); render(); } else faceAttiva(); }
function bloccaOra(){ sessionStorage.removeItem("b_unlocked"); window._faceTried=false; render(); }

function render(){
  const h = location.hash || "#home";
  const app = document.getElementById("app");
  const back = document.getElementById("btnback");
  const navEl = document.querySelector("nav.bottom");
  const footEl = document.querySelector("footer");
  // cancello d'ingresso: prima si crea il PIN, poi a ogni apertura si sblocca
  const hdrEl = document.querySelector("header.top");
  const yearEl = document.getElementById("year-mobile");
  if(yearEl) yearEl.value=String(D?.esercizio||annoDati);
  if(!daServer && (!protetta() || !sbloccata())){
    app.innerHTML = protetta() ? pgLock() : pgSetup();
    back.style.display = "none"; navEl.style.display = "none";
    footEl.style.display = "none"; hdrEl.style.display = "none";
    window.scrollTo(0,0); return;
  }
  navEl.style.display = ""; footEl.style.display = ""; hdrEl.style.display = "";
  let nav = "home";
  if (h.startsWith("#c/")){ app.innerHTML = pgCommessa(parseInt(h.slice(3),10)); nav="commesse"; back.style.display=""; back.href="#commesse"; }
  else if (h === "#dash"){ app.innerHTML = pgDash(); nav="dash"; back.style.display="none"; }
  else if (h === "#ce"){ app.innerHTML = pgCE(); nav="ce"; back.style.display="none"; }
  else if (h === "#commesse"){ app.innerHTML = pgCommesse(); nav="commesse"; back.style.display="none"; }
  else if (h === "#silsal"){ app.innerHTML = pgSilSal(); nav="silsal"; back.style.display="none"; }
  else if (h === "#dati"){ app.innerHTML = pgDati(); nav="dati"; back.style.display="none"; }
  else if (h === "#info"){ app.innerHTML = pgInfo(); nav="home"; back.style.display=""; back.href="#home"; }
  else { app.innerHTML = pgHome(); back.style.display="none"; }
  document.querySelectorAll("nav.bottom a").forEach(a =>
    a.classList.toggle("on", a.dataset.nav === nav));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
/* Riprendendo la app dopo averla lasciata aperta: col server si chiede solo la
   versione (poche decine di byte), col file aziendale si riscarica, ma non piu'
   di una volta al minuto per non consumare dati inutilmente. */
let ultimoRisync = 0;
function risincronizza(){
  if(daServer){ controllaVersione(); return; }
  if(!datiUrl) return;
  const ora = Date.now();
  if(ora - ultimoRisync < 60000) return;
  ultimoRisync = ora;
  aggiornaDaUrl(true).then(ok => { if(ok) render(); });
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) risincronizza(); });
window.addEventListener("online",()=>risincronizza());
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js?v=" + APP_VERSION, {updateViaCache:"none"})
    .then(reg => reg.update())
    .catch(()=>{});
}
const verEl = document.getElementById("ver");
if(verEl) verEl.textContent = APP_VERSION;
caricaAuto();
setInterval(controllaVersione, 90000);
</script>
